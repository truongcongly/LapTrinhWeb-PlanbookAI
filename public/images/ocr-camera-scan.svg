<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">OCR camera grading</title>
  <desc id="desc">A phone scanning a multiple choice answer sheet</desc>
  <defs>
